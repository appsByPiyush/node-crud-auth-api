name: Deploy NodeCrud App to AWS

on:
  push:
    branches:
     - master
    

jobs:
  deploy:
   runs-on: ubuntu-latest

  steps:
   - name: Checkout Code
     uses: actions/checkout@v4

   - name: Deploy Via SSH
     uses: appleboy/ssh-action@v1.0.3 
     with: ${{ secrets.SSH_HOST }}
     username: ${{ secrets.SSH_USERNAME }}
     key: ${{ secrets.SSH_KEY }}
     scripts: |
        cd /home/deploybot/node-crud-app
        git pull origin master
        docker compose up -d --build